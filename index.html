<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081a1c"><meta name="apple-mobile-web-app-capable" content="yes"><title>息律 · 呼吸训练</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 32%,#1a4f4a,#07191e 75%);font:16px -apple-system,system-ui,sans-serif;color:#edfff6}main{max-width:460px;margin:auto;padding:24px 17px 40px}header{font-size:13px;color:#a0e8d2;letter-spacing:2px}h1{font-size:25px;margin:17px 0 8px}p{color:#a3c9bb;font-size:13px;line-height:1.5;margin:0 0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;padding:13px 5px;border:1px solid #ffffff22;border-radius:14px;background:#ffffff0b}.stat b{font-size:21px;display:block}.stat small{font-size:10px;color:#aacfc0}.stage{height:310px;display:grid;place-items:center;position:relative;overflow:hidden}.ring{height:253px;width:253px;border-radius:50%;border:1px dashed #9ae8c753;position:absolute}.orb{height:238px;width:238px;border-radius:50%;position:absolute;background:radial-gradient(circle at 32% 20%,#e1fff2,#83f4d2 38%,#239f94 84%);box-shadow:0 0 70px #4df3bd55;transform:scale(.54);will-change:transform}.readout{position:relative;color:#114b40;text-align:center;text-shadow:0 1px 3px #e0fff899}.readout strong{display:block;font-size:34px}.readout b{font-size:47px}.readout small{display:block;font-size:12px}.tip{text-align:center;color:#b3e5d3;font-size:13px}.progress{background:#ffffff20;height:5px;border-radius:9px;overflow:hidden;margin:16px 0}.progress div{height:100%;width:0;background:#b1ffdd}.buttons{display:flex;gap:9px}button{border:0;border-radius:14px;padding:15px;font-weight:bold;font-size:16px}.start{background:#baffde;color:#093c33;flex:1}.reset{background:#23504a;color:#effff4}.panel{background:#ffffff0d;border:1px solid #ffffff23;border-radius:18px;padding:15px;margin-top:18px}.panel h2{font-size:14px;margin:0 0 13px}.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.settings label{font-size:11px;color:#bcddd0}.settings select{display:block;width:100%;margin-top:7px;padding:9px 5px;border:1px solid #5f9081;border-radius:9px;background:#234e45;color:white}.settings select:disabled{opacity:.6}.toggle{display:flex;align-items:center;gap:8px;margin-top:13px;font-size:12px}.toggle input{accent-color:#a8e9c7}.status{color:#b7e7d0;font-size:12px;line-height:1.6;margin:12px 0}.foot{color:#86a9a0;font-size:11px;line-height:1.6}
</style></head><body><main><header>息律 · BREATH TRAINER</header><h1>跟着圆圈呼吸</h1><p>圆圈变大时吸气，变小时呼气，每次完整吸呼计一次。</p>
<div class="stats"><div class="stat"><b id="count">0/30</b><small>已完成</small></div><div class="stat"><b id="clock">00:00</b><small>训练秒表</small></div><div class="stat"><b id="left">04:00</b><small>剩余时间</small></div></div>
<div class="stage"><div class="ring"></div><div class="orb" id="orb"></div><div class="readout"><strong id="phase">准备</strong><b id="secs">3.0</b><small id="hint">点击开始训练</small></div></div>
<div class="tip" id="tip">吸气 3 秒 / 呼气 5 秒</div><div class="progress"><div id="fill"></div></div>
<div class="buttons"><button class="start" id="start">▶ 开始训练</button><button class="reset" id="reset">重置</button></div>
<div class="panel"><h2>训练设置</h2><div class="settings"><label>吸气<select id="ins"><option value="2">2 秒</option><option value="2.5">2.5 秒</option><option value="3" selected>3 秒</option></select></label><label>呼气<select id="outs"><option value="4">4 秒</option><option value="5" selected>5 秒</option><option value="6">6 秒</option></select></label><label>次数<select id="target"><option value="8">8 次</option><option value="15">15 次</option><option value="30" selected>30 次</option></select></label></div><label class="toggle"><input type="checkbox" id="sound" checked>切换吸气/呼气时播放提示音</label></div>
<p class="status" id="status">首次建议先选 8 次并使用低阻力。</p><p class="foot">iPhone Safari 暂不支持网页可靠自动震动；可使用提示音。保持网页在前台。胸痛、头晕或明显胸闷时停止。</p></main>
<script>
(()=>{const e=id=>document.getElementById(id),ui={count:e('count'),clock:e('clock'),left:e('left'),orb:e('orb'),phase:e('phase'),secs:e('secs'),hint:e('hint'),tip:e('tip'),fill:e('fill'),start:e('start'),reset:e('reset'),ins:e('ins'),outs:e('outs'),target:e('target'),sound:e('sound'),status:e('status')};let running=false,started=false,finished=false,phase='in',done=0,offset=0,begin=0,frame=0,audio=null,wake=null;const cfg=()=>({i:+ui.ins.value,o:+ui.outs.value,n:+ui.target.value});function fmt(x){x=Math.max(0,Math.ceil(x));return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function tone(f){if(!ui.sound.checked)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audio)audio=new C();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.014);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.19)}catch(z){}}function lock(v){[ui.ins,ui.outs,ui.target].forEach(x=>x.disabled=v)}async function keep(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch(z){}}function free(){if(wake){wake.release().catch(()=>{});wake=null}}function paint(t=performance.now()){let s=cfg(),c=s.i+s.o,d=phase==='in'?s.i:s.o,p=finished?d:Math.max(0,Math.min(d,running?(t-begin)/1000:offset)),v=p/d,exp=finished?0:phase==='in'?v:1-v;ui.orb.style.transform='scale('+(.54+.46*(.5-.5*Math.cos(Math.PI*exp)))+')';let spent=finished?c*s.n:done*c+(phase==='out'?s.i:0)+p;ui.count.textContent=done+'/'+s.n;ui.clock.textContent=fmt(spent);ui.left.textContent=fmt(c*s.n-spent);ui.fill.style.width=100*Math.min(1,spent/(c*s.n))+'%';ui.phase.textContent=finished?'完成':!started?'准备':phase==='in'?'吸气':'呼气';ui.secs.textContent=finished?'0.0':(d-p).toFixed(1);ui.hint.textContent=finished?'休息一下':!started?'点击开始训练':!running?'已暂停':phase==='in'?'逐渐吸气':'慢慢呼气';ui.tip.textContent='吸气 '+s.i+' 秒 / 呼气 '+s.o+' 秒';ui.start.textContent=finished?'↻ 再来一组':running?'Ⅱ 暂停':started?'▶ 继续训练':'▶ 开始训练'}function tick(t){if(!running)return;let s=cfg(),k=0;while(running&&k++<100){let d=(phase==='in'?s.i:s.o)*1000;if(t-begin<d)break;begin+=d;if(phase==='in'){phase='out';tone(430)}else{done++;if(done>=s.n){running=false;finished=true;free();tone(900);ui.status.textContent='完成 '+s.n+' 次，取下器械自由呼吸。';break}phase='in';tone(700)}}paint(t);if(running)frame=requestAnimationFrame(tick)}function pause(txt){if(!running)return;offset=Math.max(0,(performance.now()-begin)/1000);running=false;cancelAnimationFrame(frame);free();ui.status.textContent=txt||'已暂停，休息后可以继续。';paint()}function reset(){running=false;started=false;finished=false;phase='in';done=0;offset=0;cancelAnimationFrame(frame);lock(false);free();ui.status.textContent='准备就绪，低阻力开始。';paint()}ui.start.onclick=()=>{if(finished)reset();if(running){pause();return}if(!started){started=true;lock(true)}running=true;begin=performance.now()-offset*1000;tone(700);keep();ui.status.textContent='训练中，放松肩颈、不要屏气。';paint();frame=requestAnimationFrame(tick)};ui.reset.onclick=reset;[ui.ins,ui.outs,ui.target].forEach(x=>x.onchange=()=>{if(!started)paint()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)pause('离开网页后已自动暂停。')});paint()})();
</script></body></html>
